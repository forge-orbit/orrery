name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Generated contract is up to date
        run: |
          pnpm gen
          git diff --exit-code contract/ || {
            echo "::error::contract/ is out of date. Run 'pnpm gen' and commit the result."
            exit 1
          }
      - name: Migrations come from the Drizzle schema
        run: |
          node scripts/check-migrations.mjs
          if [ ! -f apps/server/src/db/schema.ts ]; then
            echo "No Drizzle schema yet, so there is nothing to compare."
            exit 0
          fi
          pnpm db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            git status --porcelain -- db/migrations
            echo "::error::db/migrations/ does not match apps/server/src/db/schema.ts. Run 'pnpm db:generate' and commit the result. Don't write migrations by hand."
            exit 1
          fi
      - name: Formal verification models pass
        run: python3 .agents/skills/formal-verify-orrery/scripts/verify.py

  test:
    name: Unit and Postgres tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts a real Postgres through the runner's Docker.
      - run: pnpm test

  e2e:
    name: End-to-end against the Docker image
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      # The stack's one-time setup secret (at least 32 characters); the tests must know it
      # to drive bootstrap.
      BOOTSTRAP_SECRET: ci-bootstrap-secret-0123456789abcdef
      # The key that encrypts instance secrets at rest (ADR-0004): base64 for exactly
      # 32 bytes. The SMTP spec saves a password, so the stack needs it. Deliberately
      # readable, not a secret: it decodes to "this-key-is-just-a-test-fixture!" and
      # only ever encrypts the throwaway Mailpit password in this job.
      ORRERY_ENCRYPTION_KEY: dGhpcy1rZXktaXMtanVzdC1hLXRlc3QtZml4dHVyZSE=
      # The webhook e2e spec delivers to a receiver on the host; opt in to private URLs.
      ORRERY_WEBHOOK_ALLOW_PRIVATE_URLS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Newly created Docker veth interfaces run IPv6 Duplicate Address Detection (~1-1.5s)
      # on the host after `docker compose restart orrery`, emitting RTM_NEWADDR when DAD
      # completes and causing Chromium to abort in-flight asset fetches with
      # net::ERR_NETWORK_CHANGED.
      - name: Disable IPv6 DAD on new Docker veth interfaces
        run: sudo sysctl -w net.ipv6.conf.default.accept_dad=0 net.ipv6.conf.default.disable_ipv6=1
      # The mail-test profile starts the Mailpit catcher the SMTP checks read from.
      - run: docker compose --profile mail-test up -d --build --wait
      - name: Install the browser for the Playwright specs
        run: pnpm --filter @orrery/e2e exec playwright install --with-deps chromium
      - name: REST and browser checks, including a restart
        run: >
          ORRERY_URL=http://localhost:8080
          ORRERY_SETUP_SECRET=ci-bootstrap-secret-0123456789abcdef
          ORRERY_RESTART_CMD="docker compose -f $GITHUB_WORKSPACE/compose.yaml restart orrery"
          pnpm test:e2e
      # The e2e suites record every secret they use or receive in
      # tests/e2e/.secrets-used; the log check fails if the stack's logs (orrery and
      # postgres) contain any of them, and never prints the values.
      - name: The stack's logs contain no secrets
        if: always()
        run: node scripts/check-e2e-logs.mjs
      - if: failure()
        run: docker compose logs
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  runner-pack:
    name: Runner tarball smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds @forge-orbit/orrery-runner, packs it, audits tarball hygiene,
      # and runs --help/--version through the npm .bin symlink in isolation.
      - run: node scripts/smoke-runner-pack.mjs

  publish:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/forge-orbit/orrery
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ORRERY_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One-time maintainer bootstrap prerequisite for the `npm` job below: the
  # `@forge-orbit` npm org must be claimed/verified, an initial bootstrap
  # publish of `@forge-orbit/orrery-runner` must exist, and GitHub Actions
  # OIDC Trusted Publishing must be configured for `forge-orbit/orrery`.
  # Until then, tagged `v*` builds will fail at the publish step while the
  # Docker image publish and PR checks keep working. See
  # docs/guides/local-runner.md for the end-user install story.
  npm:
    name: Publish runner to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Publish @forge-orbit/orrery-runner with OIDC provenance
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          export STAMP_VERSION="$VERSION"
          if ! node --input-type=module -e '
            const version = process.env.STAMP_VERSION ?? "";
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/.test(version)) process.exit(1);
          '; then
            echo "::error::Tag $TAG is not valid semver."
            exit 1
          fi
          # Idempotency: skip when this version is already on npm.
          if npm view "@forge-orbit/orrery-runner@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "Version $VERSION is already published; skipping."
            exit 0
          fi
          # Stamp the release version before building so the bundle bakes it in.
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "apps/runner/package.json";
            const pkg = JSON.parse(readFileSync(path, "utf8"));
            pkg.version = process.env.STAMP_VERSION;
            writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          '
          pnpm --filter @forge-orbit/orrery-runner build
          PUBLISH_TAG_ARGS=""
          case "$VERSION" in
            *-*) PUBLISH_TAG_ARGS="--tag next" ;;
          esac
          pnpm --filter @forge-orbit/orrery-runner publish \
            --provenance --access public --no-git-checks $PUBLISH_TAG_ARGS

  # GHCR is the only published container registry; the release body points at
  # its image alongside the npm runner package.
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            --notes-file - <<EOF
          **Pull the image**

          \`\`\`sh
          docker pull ghcr.io/forge-orbit/orrery:${VERSION}
          \`\`\`

          **Install the local runner**

          \`\`\`sh
          npm install -g @forge-orbit/orrery-runner
          # or run it without installing:
          npx @forge-orbit/orrery-runner --help
          \`\`\`

          > Not an OS sandbox: the runner's local permission policy is an
          > application-layer gate. Allowed commands run with your OS user's
          > privileges; use a container, VM, or OS sandbox wrapper for hard
          > confinement.
          EOF
