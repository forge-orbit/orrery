# Self-hosted Orrery: `cp .env.example .env`, set POSTGRES_PASSWORD, then `docker compose up -d`.
# For HTTPS on a public domain, set ORRERY_DOMAIN and PUBLIC_URL and add `--profile tls`.
# For S3 storage, set ORRERY_STORAGE_DRIVER=s3 and add `--profile storage` to run RustFS.
name: orrery

services:
  orrery:
    image: ghcr.io/forge-orbit/orrery:${ORRERY_VERSION:-latest}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://orrery:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/orrery
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # One-time secret for initial setup (issue #21), at least 32 characters.
      # Empty or unset keeps setup closed: nobody can create the administrator.
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
      # The key that encrypts instance secrets at rest (ADR-0004): base64 for exactly
      # 32 bytes. Empty or unset means no key, and an SMTP password cannot be saved
      # until it is set. Generate with: openssl rand -base64 32
      ORRERY_ENCRYPTION_KEY: ${ORRERY_ENCRYPTION_KEY:-}
      # Default-deny SSRF: webhooks only reach public https URLs unless explicitly opted in.
      ORRERY_WEBHOOK_ALLOW_PRIVATE_URLS: ${ORRERY_WEBHOOK_ALLOW_PRIVATE_URLS:-false}
      # Object storage (ADR-0008). The default driver needs no extra services: blobs
      # live under ORRERY_DATA_DIR/objects, backed by the named `orrery-data` volume.
      # Set ORRERY_STORAGE_DRIVER=s3 in .env and start `--profile storage` (or point
      # at your own S3 provider) to use the bucket instead.
      ORRERY_STORAGE_DRIVER: ${ORRERY_STORAGE_DRIVER:-local}
      ORRERY_DATA_DIR: /app/data
      # No fallbacks here on purpose: with driver=s3 a missing value must stop startup.
      ORRERY_S3_ENDPOINT: ${ORRERY_S3_ENDPOINT:-}
      ORRERY_S3_BUCKET: ${ORRERY_S3_BUCKET:-}
      ORRERY_S3_REGION: ${ORRERY_S3_REGION:-}
      ORRERY_S3_ACCESS_KEY_ID: ${ORRERY_S3_ACCESS_KEY_ID:-}
      ORRERY_S3_SECRET_ACCESS_KEY: ${ORRERY_S3_SECRET_ACCESS_KEY:-}
      ORRERY_S3_FORCE_PATH_STYLE: ${ORRERY_S3_FORCE_PATH_STYLE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Lets an opted-in webhook reach a receiver listening on the host (used by the e2e suite).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ORRERY_PORT:-8080}:8080"
    volumes:
      - orrery-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: orrery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: orrery
    volumes:
      - pgdata:/var/lib/postgresql
    # Only reachable from this machine; used by `pnpm dev`.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orrery", "-d", "orrery"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The test email catcher (issue #22): the installation's outgoing mail lands here,
  # stored, never forwarded anywhere. The e2e suite proves real delivery by reading this
  # API, and the web UI doubles as a debugging inbox. Only `--profile mail-test` starts
  # it (like Caddy's tls profile), so a plain `docker compose up -d` runs a production
  # stack with no catcher listening.
  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: [mail-test]
    restart: unless-stopped
    ports:
      # Host-side only, so only this machine can read the mail or the UI. The orrery
      # container reaches the SMTP listener at mailpit:1025 over the compose network.
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"

  # Optional S3-compatible object storage for larger or multi-replica installations. Like the
  # tls and mail-test profiles, a plain `docker compose up -d` does NOT start it. Set
  # ORRERY_STORAGE_DRIVER=s3 in .env, start this profile, and create the bucket once (see
  # docs/guides/install.md). Both ports are host-side only; the app reaches :9000 over the
  # compose network, and :9001 is RustFS's web console for bucket administration.
  rustfs:
    image: rustfs/rustfs:latest
    profiles: [storage]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${ORRERY_S3_ACCESS_KEY_ID:-orreryaccesskey}
      RUSTFS_SECRET_KEY: ${ORRERY_S3_SECRET_ACCESS_KEY:-orrerysecretkey}
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data

  # Optional HTTPS with an automatic Let's Encrypt certificate. Agents on members' machines need
  # Orrery over HTTPS. Skip this profile if you already run a reverse proxy; point it at :8080.
  caddy:
    image: caddy:2
    profiles: [tls]
    restart: unless-stopped
    environment:
      ORRERY_DOMAIN: ${ORRERY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - orrery

volumes:
  pgdata:
  orrery-data:
  rustfs-data:
  caddy-data:
  caddy-config:
